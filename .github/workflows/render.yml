name: Render video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render video
        run: npx remotion render HelloWorld out/hello-world.mp4 --concurrency=3

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/*.mp4
          retention-days: 30
