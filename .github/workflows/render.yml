name: Render video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render funfacts
        run: npx remotion render funfacts out/funfacts.mp4 --concurrency=3

      - name: Render wapres
        run: npx remotion render wapres out/wapres.mp4 --concurrency=3

      - name: Render jxl-info
        run: npx remotion render jxl-info out/jxl-info.mp4 --concurrency=3

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: out/*.mp4
          retention-days: 30
